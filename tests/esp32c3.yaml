# Compile test mirroring the target lamp hardware: ESP32-C3 with the nRF24
# on the default FSPI pins, CE on GPIO7, CSN on GPIO8 (same wiring as the
# legacy SMART_WIFI-RF24_LAMP boards).
esphome:
  name: nrf24-bthome-test

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: VERBOSE

wifi:
  ap: {}

captive_portal:

api:

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: ../components

spi:
  clk_pin: GPIO4
  miso_pin: GPIO5
  mosi_pin: GPIO6

nrf24_bthome:
  cs_pin: GPIO8
  ce_pin: GPIO7
  channel: 100
  address: "BTHME"
  devices:
    - id: remote1
      sender_id: "B7:4F:E7:7F"
      on_button:
        - logger.log:
            format: "button %u: %s"
            args: [button, event.c_str()]
        - if:
            condition:
              lambda: return event == "press";
            then:
              - light.toggle: test_led
      on_dimmer:
        - logger.log:
            format: "dimmer %u: %d steps"
            args: [dimmer, steps]
        - if:
            condition:
              lambda: return dimmer == 1;
            then:
              - light.dim_relative:
                  id: test_led
                  relative_brightness: !lambda return steps * 0.05f;

# Virtual LED on a free pin (no physical LED needed): state is visible and
# controllable in Home Assistant, driven by the remote via the automations.
output:
  - platform: ledc
    pin: GPIO10
    id: led_output

light:
  - platform: monochromatic
    id: test_led
    name: "RF24 Test LED"
    output: led_output
    default_transition_length: 100ms

sensor:
  - platform: nrf24_bthome
    nrf24_bthome_device_id: remote1
    battery:
      name: "Remote 1 Battery"
    voltage:
      name: "Remote 1 Voltage"

text_sensor:
  - platform: nrf24_bthome
    nrf24_bthome_device_id: remote1
    device_name:
      name: "Remote 1 Name"
    firmware_version:
      name: "Remote 1 Firmware"
    sender_id:
      name: "Remote 1 Sender ID"
