# Compile test mirroring the target lamp hardware: ESP32-C3 with the nRF24
# on the default FSPI pins, CE on GPIO7, CSN on GPIO8 (same wiring as the
# legacy SMART_WIFI-RF24_LAMP boards).
esphome:
  name: nrf24-bthome-test

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: VERBOSE

wifi:
  ap: {}

captive_portal:

api:

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: ../components

spi:
  clk_pin: GPIO4
  miso_pin: GPIO5
  mosi_pin: GPIO6

time:
  - platform: homeassistant
    id: ha_time

nrf24:
  cs_pin: GPIO8
  ce_pin: GPIO7
  irq_pin: GPIO9
  channel: 100
  air_data_rate: 250kbps
  pipes:
    - address: "BTHME"

nrf24_bthome:
  time_id: ha_time
  devices:
    - id: remote1
      sender_id: "B7:4F:E7:7F"
      timeout: 3min  # remote currently sends status every ~1min (test build)
      on_button:
        - logger.log:
            format: "button %u: %s"
            args: [button, event.c_str()]
        - if:
            condition:
              lambda: return event == "press";
            then:
              - light.toggle: test_led
      on_dimmer:
        - logger.log:
            format: "dimmer %u: %d steps"
            args: [dimmer, steps]
        - if:
            condition:
              lambda: return dimmer == 1;
            then:
              - light.dim_relative:
                  id: test_led
                  relative_brightness: !lambda return steps * 0.05f;
        - if:
            condition:
              lambda: return dimmer == 2;
            then:
              # Held-rotate shifts the color temperature; right = warmer,
              # like the legacy lamp firmware. ~15 mireds per detent spans
              # the 153-370 range in ~14 steps.
              - lambda: |-
                  auto call = id(test_led).make_call();
                  const float ct = id(test_led).remote_values.get_color_temperature();
                  call.set_color_temperature(clamp(ct + steps * 15.0f, 153.0f, 370.0f));
                  call.perform();

# Virtual CCT light on free pins (no physical LEDs needed): state is visible
# and controllable in Home Assistant, driven by the remote via the automations.
# Mirrors the real lamps: 2700-6500 K, warm+cold sum to the set brightness.
output:
  - platform: ledc
    pin: GPIO10
    id: warm_output
  - platform: ledc
    pin: GPIO3
    id: cold_output

light:
  - platform: cwww
    id: test_led
    name: "RF24 Test LED"
    warm_white: warm_output
    cold_white: cold_output
    warm_white_color_temperature: 370 mireds  # 2700 K
    cold_white_color_temperature: 153 mireds  # 6500 K
    constant_brightness: true
    default_transition_length: 100ms

sensor:
  - platform: nrf24_bthome
    nrf24_bthome_device_id: remote1
    battery:
      name: "Remote 1 Battery"
    voltage:
      name: "Remote 1 Voltage"
    last_seen:
      name: "Remote 1 Last Seen"

binary_sensor:
  - platform: nrf24_bthome
    nrf24_bthome_device_id: remote1
    connected:
      name: "Remote 1 Connected"

text_sensor:
  - platform: nrf24_bthome
    nrf24_bthome_device_id: remote1
    device_name:
      name: "Remote 1 Name"
    firmware_version:
      name: "Remote 1 Firmware"
    sender_id:
      name: "Remote 1 Sender ID"
