# Lab receiver on a WT32-ETH01: an nRF24 listener that is always reachable over
# Ethernet, so the component can be flashed and its logs read without a serial
# port. Named after the device already adopted in Home Assistant, so it keeps
# its entities.
#
# Hardware: WT32-ETH01 (ESP32 + LAN8720). nRF24 on HSPI (CLK 12, MISO 15,
# MOSI 14) with CE 4, CSN 2, IRQ 33. Two onboard LEDs on GPIO5 and GPIO17,
# both active low.
#
# Flash and watch over the network:
#   esphome run   tests/wt32-eth01.yaml --device 192.168.2.70
#   esphome logs  tests/wt32-eth01.yaml --device 192.168.2.70
#
# The ESPHome dashboard in Home Assistant holds a config of the same name
# without the radio - installing from there replaces this firmware.
esphome:
  name: nrf24-esp32hub
  friendly_name: NRF24 ESP32Hub

esp32:
  board: wt32-eth01
  framework:
    type: esp-idf

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_EXT_IN
    pin: GPIO0
  phy_addr: 1
  power_pin: GPIO16

# VERBOSE globally: a per-tag level may not be more verbose than the global one,
# and the radio's frame-level logging is the point of this build.
logger:
  level: VERBOSE
  # No serial port: this board is only ever reached over Ethernet, and at 115200
  # baud a VERBOSE line per frame is milliseconds of blocking write inside the
  # loop - far more than the 1.3 ms a 32-byte frame takes on the air at 250 kbps.
  # Measured: with the UART on, fast traffic loses frames the radio had already
  # received and the receiver had nowhere to put.
  baud_rate: 0

api:

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: ../components

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO14
  miso_pin: GPIO15

time:
  - platform: homeassistant
    id: ha_time

nrf24:
  cs_pin: GPIO2
  ce_pin: GPIO4
  irq_pin: GPIO33
  channel: 90
  air_data_rate: 250kbps
  pipes:
    # Senders not yet converted to fixed-length payloads: dynamic length, and
    # auto-ack because the datasheet ties the two together.
    - address: "BTHME"
    # Converted senders. Fixed 32 bytes needs no auto-ack, so this pipe stays
    # silent instead of answering broadcasts nobody asked it to answer.
    # Pipes 2-5 may differ from pipe 1 in the first byte only - "CTHME" vs
    # "BTHME" is exactly that one byte.
    - address: "CTHME"
      payload_size: 32
      auto_ack: false

nrf24_bthome:
  time_id: ha_time
  devices:
    - id: remote1
      sender_id: "B7:4F:E7:7F"
      timeout: 70min  # sender's STATUS_INTERVAL_MIN is 60
      on_button:
        - logger.log:
            format: "button %u: %s"
            args: [button, event.c_str()]
        # Visible confirmation that a click landed, without reading the log.
        - if:
            condition:
              lambda: return event == "press";
            then:
              - light.toggle: led1
      on_dimmer:
        - logger.log:
            format: "dimmer %u: %d steps"
            args: [dimmer, steps]

    # Two synthetic senders, played by the sniffer dongles, so sender
    # attribution can be tested with more than one registered device. The
    # component's own log lines do not name the device, so these automations
    # do it. Short timeout: it also exercises the offline transition and the
    # packet-id aging that comes with it.
    - id: dongle_a
      sender_id: "AA:01:00:01"
      timeout: 15s
      on_button:
        - logger.log:
            format: "DEV=A button %u: %s"
            args: [button, event.c_str()]
      on_dimmer:
        - logger.log:
            format: "DEV=A dimmer %u: %d steps"
            args: [dimmer, steps]
    # The custom board on COM34: a real sender that broadcasts temperature and
    # humidity alongside battery and voltage. It exists to show what the BTHome
    # layer currently does with anything beyond those two - namely decode it,
    # log it at VERBOSE, and drop it.
    - id: sensor_node
      sender_id: "AA:01:00:03"
      timeout: 30s  # broadcasts every 5 s

    # Every mapped sensor type at once, played by dongle A. Nothing sends to it
    # outside the bench, hence the long timeout - it exists so each row of the
    # SENSOR_TYPES table has an entity to publish into, and the log then says
    # what value, unit and accuracy that row produced.
    - id: type_probe
      sender_id: "AA:01:00:04"
      timeout: 1h

    - id: dongle_b
      sender_id: "AA:01:00:02"
      timeout: 15s
      on_button:
        - logger.log:
            format: "DEV=B button %u: %s"
            args: [button, event.c_str()]
      on_dimmer:
        - logger.log:
            format: "DEV=B dimmer %u: %d steps"
            args: [dimmer, steps]

output:
  - platform: gpio
    pin:
      number: GPIO5
      inverted: true
    id: led1_out
  - platform: gpio
    pin:
      number: GPIO17
      inverted: true
    id: led2_out

light:
  - platform: binary
    id: led1
    name: "LED 1"
    output: led1_out
  - platform: binary
    id: led2
    name: "LED 2"
    output: led2_out

sensor:
  - platform: nrf24_bthome
    nrf24_bthome_device_id: remote1
    battery:
      name: "Remote 1 Battery"
    voltage:
      name: "Remote 1 Voltage"
    last_seen:
      name: "Remote 1 Last Seen"
  # internal: the dongle senders exist for the test bench, which reads the
  # log - no reason to push them into Home Assistant.
  - platform: nrf24_bthome
    nrf24_bthome_device_id: dongle_a
    battery:
      name: "A Battery"
      internal: true
    voltage:
      name: "A Voltage"
      internal: true
  - platform: nrf24_bthome
    nrf24_bthome_device_id: dongle_b
    battery:
      name: "B Battery"
      internal: true
    voltage:
      name: "B Voltage"
      internal: true
  - platform: nrf24_bthome
    nrf24_bthome_device_id: sensor_node
    battery:
      name: "Sensor Node Battery"
    voltage:
      name: "Sensor Node Voltage"
    temperature:
      name: "Sensor Node Temperature"
    humidity:
      name: "Sensor Node Humidity"
    last_seen:
      name: "Sensor Node Last Seen"

  # Every mapped measurement at once. The entity name is the YAML key verbatim so
  # the radio bench can derive it from the same table it takes its vectors from -
  # a renamed entity would otherwise quietly stop being checked. All internal:
  # these exist to be read off the log, not to appear in Home Assistant.
  - platform: nrf24_bthome
    nrf24_bthome_device_id: type_probe
    battery:
      name: "P battery"
      internal: true
    temperature:
      name: "P temperature"
      internal: true
    humidity:
      name: "P humidity"
      internal: true
    pressure:
      name: "P pressure"
      internal: true
    illuminance:
      name: "P illuminance"
      internal: true
    mass:
      name: "P mass"
      internal: true
    mass_lb:
      name: "P mass_lb"
      internal: true
    dewpoint:
      name: "P dewpoint"
      internal: true
    count:
      name: "P count"
      internal: true
    energy:
      name: "P energy"
      internal: true
    power:
      name: "P power"
      internal: true
    voltage:
      name: "P voltage"
      internal: true
    pm2_5:
      name: "P pm2_5"
      internal: true
    pm10:
      name: "P pm10"
      internal: true
    co2:
      name: "P co2"
      internal: true
    tvoc:
      name: "P tvoc"
      internal: true
    moisture:
      name: "P moisture"
      internal: true
    humidity_u8:
      name: "P humidity_u8"
      internal: true
    moisture_u8:
      name: "P moisture_u8"
      internal: true
    rotation:
      name: "P rotation"
      internal: true
    distance_mm:
      name: "P distance_mm"
      internal: true
    distance_m:
      name: "P distance_m"
      internal: true
    duration:
      name: "P duration"
      internal: true
    current:
      name: "P current"
      internal: true
    speed:
      name: "P speed"
      internal: true
    temperature_c1:
      name: "P temperature_c1"
      internal: true
    uv_index:
      name: "P uv_index"
      internal: true
    volume:
      name: "P volume"
      internal: true
    volume_ml:
      name: "P volume_ml"
      internal: true
    volume_flow_rate:
      name: "P volume_flow_rate"
      internal: true
    voltage_centi:
      name: "P voltage_centi"
      internal: true
    gas:
      name: "P gas"
      internal: true
    volume_u32:
      name: "P volume_u32"
      internal: true
    water:
      name: "P water"
      internal: true
    timestamp:
      name: "P timestamp"
      internal: true
    acceleration:
      name: "P acceleration"
      internal: true
    gyroscope:
      name: "P gyroscope"
      internal: true
    volume_storage:
      name: "P volume_storage"
      internal: true
    conductivity:
      name: "P conductivity"
      internal: true
    temperature_s8:
      name: "P temperature_s8"
      internal: true
    temperature_s8_035:
      name: "P temperature_s8_035"
      internal: true
    direction:
      name: "P direction"
      internal: true
    precipitation:
      name: "P precipitation"
      internal: true
    channel:
      name: "P channel"
      internal: true
    rotational_speed:
      name: "P rotational_speed"
      internal: true
    speed_s32:
      name: "P speed_s32"
      internal: true
    acceleration_s32:
      name: "P acceleration_s32"
      internal: true
    light_level:
      name: "P light_level"
      internal: true
    settings_revision:
      name: "P settings_revision"
      internal: true
  # A second sensor for the same object id: index 2 takes the second
  # temperature in a payload, which needs its own platform entry.
  - platform: nrf24_bthome
    nrf24_bthome_device_id: type_probe
    temperature:
      name: "P temperature 2"
      index: 2
      internal: true

binary_sensor:
  - platform: nrf24_bthome
    nrf24_bthome_device_id: remote1
    connected:
      name: "Remote 1 Connected"
      # LED 2 mirrors the link, so the board itself shows whether the remote
      # is still being heard.
      on_press:
        - light.turn_on: led2
      on_release:
        - light.turn_off: led2
  - platform: nrf24_bthome
    nrf24_bthome_device_id: dongle_a
    connected:
      name: "A Connected"
      internal: true
  - platform: nrf24_bthome
    nrf24_bthome_device_id: dongle_b
    connected:
      name: "B Connected"
      internal: true

  # Every binary object, same naming rule as the measurements above.
  - platform: nrf24_bthome
    nrf24_bthome_device_id: type_probe
    generic:
      name: "B generic"
      internal: true
    power:
      name: "B power"
      internal: true
    opening:
      name: "B opening"
      internal: true
    battery_low:
      name: "B battery_low"
      internal: true
    battery_charging:
      name: "B battery_charging"
      internal: true
    carbon_monoxide:
      name: "B carbon_monoxide"
      internal: true
    cold:
      name: "B cold"
      internal: true
    connectivity:
      name: "B connectivity"
      internal: true
    door:
      name: "B door"
      internal: true
    garage_door:
      name: "B garage_door"
      internal: true
    gas:
      name: "B gas"
      internal: true
    heat:
      name: "B heat"
      internal: true
    light:
      name: "B light"
      internal: true
    lock:
      name: "B lock"
      internal: true
    moisture:
      name: "B moisture"
      internal: true
    motion:
      name: "B motion"
      internal: true
    moving:
      name: "B moving"
      internal: true
    occupancy:
      name: "B occupancy"
      internal: true
    plug:
      name: "B plug"
      internal: true
    presence:
      name: "B presence"
      internal: true
    problem:
      name: "B problem"
      internal: true
    running:
      name: "B running"
      internal: true
    safety:
      name: "B safety"
      internal: true
    smoke:
      name: "B smoke"
      internal: true
    sound:
      name: "B sound"
      internal: true
    tamper:
      name: "B tamper"
      internal: true
    vibration:
      name: "B vibration"
      internal: true
    window:
      name: "B window"
      internal: true

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP-Adresse"
      entity_category: diagnostic
    mac_address:
      name: "MAC-Adresse"
      entity_category: diagnostic
  - platform: nrf24_bthome
    nrf24_bthome_device_id: remote1
    device_name:
      name: "Remote 1 Name"
    firmware_version:
      name: "Remote 1 Firmware"
    sender_id:
      name: "Remote 1 Sender ID"
  # The two variable-length objects, plus a second text instance. Same naming
  # rule as the other probe entities. device_name is the first text object under
  # the name senders use 0x53 for, so it is fed by the same frames as `text`.
  - platform: nrf24_bthome
    nrf24_bthome_device_id: type_probe
    text:
      name: "P text"
      internal: true
    raw:
      name: "P raw"
      internal: true
    device_name:
      name: "P device_name"
      internal: true
    firmware_version:
      name: "P firmware_version"
      internal: true
  - platform: nrf24_bthome
    nrf24_bthome_device_id: type_probe
    text:
      name: "P text 2"
      index: 2
      internal: true
